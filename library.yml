# Node.js
# Build a general Node.js project with npm.
# Add steps that analyze code, save build artifacts, deploy, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/javascript

variables:
  - group: pipeline-secrets
  - template: templates/utils/variables.yml


resources:
  repositories:
    - repository: Library
      type: github
      endpoint: github.com_surveyjsdeveloper
      name: surveyjs/survey-library
      ref: $(branch)

    - repository: Creator
      type: github
      endpoint: github.com_surveyjsdeveloper
      name: surveyjs/survey-creator
      ref: $(branch)

    - repository: Analytics
      type: github
      endpoint: github.com_surveyjsdeveloper
      name: surveyjs/survey-analytics
      ref: $(branch)

    - repository: PDF
      type: github
      endpoint: github.com_surveyjsdeveloper
      name: surveyjs/survey-pdf
      ref: $(branch)

    - repository: Service
      type: github
      endpoint: github.com_surveyjsdeveloper
      name: surveyjs/service
      ref: $(branch)

    - repository: SiteData
      type: github
      endpoint: github.com_surveyjsdeveloper
      name: surveyjs/surveyjs-site-data
      ref: $(siteDataRef)

    - repository: Utils
      type: github
      endpoint: github.com_surveyjsdeveloper
      name: surveyjs/survey-utils

    - repository: ThemeAdapterDemos
      type: github
      endpoint: github.com_surveyjsdeveloper
      name: surveyjs/theme-adapter-demos

stages:
  - stage: Lint
    dependsOn: []
    jobs:
      - job:
        steps:
          - checkout: self
            timeoutInMinutes: 5
            retryCountOnTaskFailure: 5
            fetchDepth: 1

          - template: templates/utils/npm.yml
            parameters:
              directories:
                - $(Build.SourcesDirectory)

          # npm resolves eslint-plugin-surveyjs from a git URL. It tries https first and, when
          # that fails, silently retries over ssh - where the agent has no key, so the log shows
          # only "Permission denied (publickey)" and hides the real error. The extraheader
          # authenticates the request (anonymous git to github.com gets rate-limited across the
          # agent pool); rewriting ssh to https keeps the real failure visible when it happens.
          # An empty extraheader resets the header list, so a fork PR without the secret still
          # works anonymously.
          - bash: |
              set -e
              AUTH=""
              if [ -n "${GITHUB_TOKEN:-}" ]; then
                AUTH="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
              fi
              export GIT_CONFIG_COUNT=3
              export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" GIT_CONFIG_VALUE_0="$AUTH"
              export GIT_CONFIG_KEY_1="url.https://github.com/.insteadOf"    GIT_CONFIG_VALUE_1="ssh://git@github.com/"
              export GIT_CONFIG_KEY_2="url.https://github.com/.insteadOf"    GIT_CONFIG_VALUE_2="git@github.com:"
              npm update eslint-plugin-surveyjs --no-package-lock --no-audit --no-fund
            workingDirectory: $(Build.SourcesDirectory)
            displayName: "Update eslint-plugin-surveyjs dependency"
            env:
              GITHUB_TOKEN: $(GITHUB_TOKEN)

          - script: npm run lint
            workingDirectory: $(Build.SourcesDirectory)


  - stage: Options
    dependsOn: []
    jobs:
      - job: PRTitle
        displayName: "PR title"
        condition: eq(variables.isStage, 'False')
        steps:
          - template: templates/utils/pr_title_parser.yml
      - job: Commit
        displayName: "Commit message"
        condition: eq(variables.isStage, 'False')
        steps:
          - template: templates/utils/commit_message_parser.yml


  ##############
  # Test Phase #
  ##############
  - stage: LibraryCoreTest
    displayName: "Library Core Test"
    dependsOn:
      - Options
    condition: and(succeeded(), eq(dependencies.Options.outputs['Commit.data.SCR_UPDATE'], ''))
    jobs:
      - template: templates/library/core/test.yml

  - stage: LibraryReactTest
    displayName: "Library React Test"
    dependsOn:
      - Options
    condition: succeeded()
    variables:
      SCR_UPDATE: $[ stageDependencies.Options.Commit.outputs['data.SCR_UPDATE'] ]
    jobs:
      - template: templates/library/react/test.yml

  - stage: LibraryAngularTest
    displayName: "Library Angular Test"
    dependsOn:
      - Options
    condition: and(succeeded(), eq(dependencies.Options.outputs['Commit.data.SCR_UPDATE'], ''))
    jobs:
      - template: templates/library/angular/test.yml

  - stage: LibraryVueTest
    displayName: "Library Vue Test"
    dependsOn:
      - Options
    condition: and(succeeded(), eq(dependencies.Options.outputs['Commit.data.SCR_UPDATE'], ''))
    jobs:
      - template: templates/library/vue/test.yml

  - stage: LibraryJSTest
    displayName: "Library JS (Preact ShadowDOM BoxSizing) Test"
    dependsOn:
      - Options
    condition: and(succeeded(), eq(dependencies.Options.outputs['Commit.data.SCR_UPDATE'], ''))
    jobs:
      - template: templates/library/js/test.yml

  - stage: CreatorCoreTest
    displayName: "Creator Core Test"
    dependsOn:
      - Options
    variables:
      PR: $[ stageDependencies.Options.PRTitle.outputs['data.CREATOR'] ]
    condition: and(succeeded(), eq(dependencies.Options.outputs['Commit.data.SCR_UPDATE'], ''))
    jobs:
      - template: templates/creator/core/test.yml
        parameters:
          checkout: Creator
          libraryCheckout: self

  - stage: CreatorReactTest
    displayName: "Creator React Test"
    dependsOn:
      - Options
    variables:
      PR: $[ stageDependencies.Options.PRTitle.outputs['data.CREATOR'] ]
    condition: and(succeeded(), eq(dependencies.Options.outputs['Commit.data.SCR_UPDATE'], ''))
    jobs:
      - template: templates/creator/react/test.yml
        parameters:
          checkout: Creator
          libraryCheckout: self

  - stage: CreatorAngularTest
    displayName: "Creator Angular Test"
    dependsOn:
      - Options
    variables:
      PR: $[ stageDependencies.Options.PRTitle.outputs['data.CREATOR'] ]
    condition: and(succeeded(), eq(dependencies.Options.outputs['Commit.data.SCR_UPDATE'], ''))
    jobs:
      - template: templates/creator/angular/test.yml
        parameters:
          checkout: Creator
          libraryCheckout: self

  - stage: CreatorVueTest
    displayName: "Creator Vue Test"
    dependsOn:
      - Options
    variables:
      PR: $[ stageDependencies.Options.PRTitle.outputs['data.CREATOR'] ]
    condition: and(succeeded(), eq(dependencies.Options.outputs['Commit.data.SCR_UPDATE'], ''))
    jobs:
      - template: templates/creator/vue/test.yml
        parameters:
          checkout: Creator
          libraryCheckout: self

  - stage: CreatorJSTest
    displayName: "Creator JS (Preact ShadowDOM BoxSizing) Test"
    dependsOn:
      - Options
    variables:
      PR: $[ stageDependencies.Options.PRTitle.outputs['data.CREATOR'] ]
    condition: and(succeeded(), eq(dependencies.Options.outputs['Commit.data.SCR_UPDATE'], ''))
    jobs:
      - template: templates/creator/js/test.yml
        parameters:
          checkout: Creator
          libraryCheckout: self

  - stage: AnalyticsTest
    displayName: "Analytics Test"
    dependsOn:
      - Options
    variables:
      PR: $[ stageDependencies.Options.PRTitle.outputs['data.ANALYTICS'] ]
    condition: and(succeeded(), eq(dependencies.Options.outputs['Commit.data.SCR_UPDATE'], ''))
    jobs:
      - template: templates/analytics/test.yml
        parameters:
          checkout: Analytics
          libraryCheckout: self

  - stage: PDFTest
    displayName: "PDF Test"
    dependsOn:
      - Options
    variables:
      PR: $[ stageDependencies.Options.PRTitle.outputs['data.PDF'] ]
    condition: and(succeeded(), eq(dependencies.Options.outputs['Commit.data.SCR_UPDATE'], ''))
    jobs:
      - template: templates/pdf/test.yml
        parameters:
          checkout: PDF
          libraryCheckout: self

  - stage: ThemeAdapterDemosTest
    displayName: "Theme Adapter Demos"
    dependsOn:
      - Options
    variables:
      PR: $[ stageDependencies.Options.PRTitle.outputs['data.ADAPTERS'] ]
      LIBRARY_PR: ''
      CREATOR_PR: $[ stageDependencies.Options.PRTitle.outputs['data.CREATOR'] ]
    condition: and(succeeded(), eq(variables['Build.Reason'], 'PullRequest'), in(variables['System.PullRequest.TargetBranch'], 'master', 'refs/heads/master'), eq(dependencies.Options.outputs['Commit.data.SCR_UPDATE'], ''))
    jobs:
      - template: templates/theme-adapter-demos/test.yml
        parameters:
          checkout: ThemeAdapterDemos
          libraryCheckout: self
          creatorCheckout: Creator




  ###############
  # Stage Phase #
  ###############
  - ${{ if eq(variables.isStage, 'True') }}:
    - stage: Staging
      displayName: "Staging"
      dependsOn:
        - LibraryCoreTest
        - LibraryReactTest
        - LibraryAngularTest
        - LibraryVueTest
        - LibraryJSTest
      jobs:
      - job:
        steps:
          - template: templates/library/staging.yml

  # Backport: every [backport:<branch>] flag in the title of the PR merged into master
  # cherry-picks it onto that branch and opens a PR. See templates/utils/backport.yml.
  # Not wrapped in the isStage block - the stage gates itself on the source branch below.
  - stage: Backport
    displayName: "Backport"
    dependsOn:
      - LibraryCoreTest
      - LibraryReactTest
      - LibraryAngularTest
      - LibraryVueTest
      - LibraryJSTest
      - CreatorCoreTest
      - CreatorReactTest
      - CreatorAngularTest
      - CreatorVueTest
      - CreatorJSTest
      - AnalyticsTest
      - PDFTest
    condition: and(succeeded(), eq(variables['Build.SourceBranchName'], 'master'))
    jobs:
      - template: templates/utils/backport.yml
