parameters:
  - name: checkout
    type: string
    default: self
  - name: libraryCheckout
    type: string
    default: Library

jobs:
  - job:
    displayName: "Markup & Example & A11Y"
    steps:
      - template: build.yml
        parameters:
          checkout: ${{ parameters.checkout }}
          libraryCheckout: ${{ parameters.libraryCheckout }}

      - script: npm run test:single
        workingDirectory: $(Build.SourcesDirectory)/packages/survey-creator-angular
        displayName: "Test"

      - script: npm run build:example:prod
        workingDirectory: $(Build.SourcesDirectory)/packages/survey-creator-angular
        displayName: "Build Example"

      # the a11y script pins --reporter dot, so junit is appended back here to get a results file
      - script: npm run test:a11y:ci -- --reporter dot,junit
        workingDirectory: $(Build.SourcesDirectory)/packages/survey-creator-angular
        displayName: "Test A11Y"
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: "$(Build.SourcesDirectory)/packages/survey-creator-angular/test-results/a11y-junit-results.xml"

      - task: PublishBuildArtifacts@1
        inputs:
          PathtoPublish: "$(Build.SourcesDirectory)/packages/survey-creator-angular/test-results"
          ArtifactName: "Creator_Angular_A11Y"
          publishLocation: "Container"
        condition: always()
        displayName: "Publish A11Y artifacts"

      - task: PublishTestResults@2
        inputs:
          searchFolder: "$(Build.SourcesDirectory)/packages/survey-creator-angular/test-results"
          testResultsFormat: "JUnit"
          testResultsFiles: "a11y-junit-results.xml"
          mergeTestResults: true
          failTaskOnFailedTests: true
          testRunTitle: "Creator Angular A11Y Tests"
        condition: succeededOrFailed()
        displayName: "Publish A11Y results"

  - job:
    displayName: "E2E"
    steps:
      - template: build.yml
        parameters:
          checkout: ${{ parameters.checkout }}
          libraryCheckout: ${{ parameters.libraryCheckout }}

      - script: npm run build:example:prod
        workingDirectory: $(Build.SourcesDirectory)/packages/survey-creator-angular
        displayName: "Build Example"
        
      - script: npm run e2e:ci
        workingDirectory: $(Build.SourcesDirectory)/packages/survey-creator-angular
        displayName: "Test E2E"

      - task: PublishBuildArtifacts@1
        inputs:
          PathtoPublish: "$(Build.SourcesDirectory)/packages/survey-creator-angular/test-results"
          ArtifactName: "Creator_Angular_E2E"
          publishLocation: "Container"
        condition: always()
        displayName: "Publish artifacts"

      - task: PublishTestResults@2
        inputs:
          searchFolder: "$(Build.SourcesDirectory)/packages/survey-creator-angular/test-results"
          testResultsFormat: "JUnit"
          testResultsFiles: "e2e-junit-results.xml"
          mergeTestResults: true
          failTaskOnFailedTests: true
          testRunTitle: "Creator Angular E2E Tests"
        condition: succeededOrFailed()
        displayName: "Publish results"

  - job:
    displayName: "SCR"
    steps:
      - template: build.yml
        parameters:
          checkout: ${{ parameters.checkout }}
          libraryCheckout: ${{ parameters.libraryCheckout }}

      - script: npm run build:example:prod
        workingDirectory: $(Build.SourcesDirectory)/packages/survey-creator-angular
        displayName: "Build Example"
        
      - script: npm run test:scr:ci
        workingDirectory: $(Build.SourcesDirectory)/packages/survey-creator-angular
        displayName: "Test SCR"

      - task: PublishBuildArtifacts@1
        inputs:
          PathtoPublish: "$(Build.SourcesDirectory)/packages/survey-creator-angular/test-results"
          ArtifactName: "Creator_Angular_SCR"
          publishLocation: "Container"
        condition: always()
        displayName: "Publish artifacts"

      - task: PublishTestResults@2
        inputs:
          searchFolder: "$(Build.SourcesDirectory)/packages/survey-creator-angular/test-results"
          testResultsFormat: "JUnit"
          testResultsFiles: "e2e-junit-results.xml"
          mergeTestResults: true
          failTaskOnFailedTests: true
          testRunTitle: "Creator Angular SCR Tests"
        condition: succeededOrFailed()
        displayName: "Publish results"
