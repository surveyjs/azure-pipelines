parameters:
  - name: checkout
    type: string
    default: self
  - name: libraryCheckout
    type: string
    default: Library

jobs:
  - job:
    displayName: "Example & A11Y"
    condition: eq(variables['SCR_UPDATE'], '')
    steps:
      - template: build.yml
        parameters:
          checkout: ${{ parameters.checkout }}
          libraryCheckout: ${{ parameters.libraryCheckout }}

      - script: npm run build
        workingDirectory: $(Build.SourcesDirectory)/packages/survey-creator-react/example
        displayName: "Build Example"

      - script: npm run test
        workingDirectory: $(Build.SourcesDirectory)/packages/survey-creator-react
        displayName: "Test"

      # the a11y script pins --reporter dot, so junit is appended back here to get a results file
      - script: npm run test:a11y:ci -- --reporter dot,junit
        workingDirectory: $(Build.SourcesDirectory)/packages/survey-creator-react
        displayName: "Test A11Y"
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: "$(Build.SourcesDirectory)/packages/survey-creator-react/test-results/a11y-junit-results.xml"

      - task: PublishBuildArtifacts@1
        inputs:
          PathtoPublish: "$(Build.SourcesDirectory)/packages/survey-creator-react/test-results"
          ArtifactName: "Creator_React_A11Y"
          publishLocation: "Container"
        condition: always()
        displayName: "Publish A11Y artifacts"

      - task: PublishTestResults@2
        inputs:
          searchFolder: "$(Build.SourcesDirectory)/packages/survey-creator-react/test-results"
          testResultsFormat: "JUnit"
          testResultsFiles: "a11y-junit-results.xml"
          mergeTestResults: true
          failTaskOnFailedTests: true
          testRunTitle: "Creator React A11Y Tests"
        condition: succeededOrFailed()
        displayName: "Publish A11Y results"

  - job:
    displayName: "E2E"
    condition: eq(variables['SCR_UPDATE'], '')
    steps:
      - template: build.yml
        parameters:
          checkout: ${{ parameters.checkout }}
          libraryCheckout: ${{ parameters.libraryCheckout }}
        
      - script: npm run e2e:ci
        workingDirectory: $(Build.SourcesDirectory)/packages/survey-creator-react
        displayName: "Test E2E"

      - task: PublishBuildArtifacts@1
        inputs:
          PathtoPublish: "$(Build.SourcesDirectory)/packages/survey-creator-react/test-results"
          ArtifactName: "Creator_React_E2E"
          publishLocation: "Container"
        condition: always()
        displayName: "Publish artifacts"

      - task: PublishTestResults@2
        inputs:
          searchFolder: "$(Build.SourcesDirectory)/packages/survey-creator-react/test-results"
          testResultsFormat: "JUnit"
          testResultsFiles: "e2e-junit-results.xml"
          mergeTestResults: true
          failTaskOnFailedTests: true
          testRunTitle: "Creator React E2E Tests"
        condition: succeededOrFailed()
        displayName: "Publish results"

  - job:
    displayName: "SCR Test"
    condition: eq(variables['SCR_UPDATE'], '')
    steps:
      - template: build.yml
        parameters:
          checkout: ${{ parameters.checkout }}
          libraryCheckout: ${{ parameters.libraryCheckout }}
        
      - script: npm run test:scr:ci
        workingDirectory: $(Build.SourcesDirectory)/packages/survey-creator-react
        displayName: "Test SCR"

      - task: PublishBuildArtifacts@1
        inputs:
          PathtoPublish: "$(Build.SourcesDirectory)/packages/survey-creator-react/test-results"
          ArtifactName: "Creator_React_SCR"
          publishLocation: "Container"
        condition: always()
        displayName: "Publish artifacts"

      - task: PublishTestResults@2
        inputs:
          searchFolder: "$(Build.SourcesDirectory)/packages/survey-creator-react/test-results"
          testResultsFormat: "JUnit"
          testResultsFiles: "e2e-junit-results.xml"
          mergeTestResults: true
          failTaskOnFailedTests: true
          testRunTitle: "Creator React SCR Tests"
        condition: succeededOrFailed()
        displayName: "Publish results"
        
  - job:
    displayName: "SCR Legacy"
    condition: and(or(eq(variables['System.PullRequest.TargetBranch'], 'V2'), eq(variables['Build.SourceBranchName'], 'V2')), eq(variables['SCR_UPDATE'], ''))
    steps:
      - template: build.yml
        parameters:
          checkout: ${{ parameters.checkout }}
          libraryCheckout: ${{ parameters.libraryCheckout }}
        
      - script: npm run test:scr:legacy:ci
        workingDirectory: $(Build.SourcesDirectory)/packages/survey-creator-react
        displayName: "Test SCR Legacy"

      - task: PublishBuildArtifacts@1
        inputs:
          PathtoPublish: "$(Build.SourcesDirectory)/packages/survey-creator-react/test-results"
          ArtifactName: "Creator_React_SCR_Legacy"
          publishLocation: "Container"
        condition: always()
        displayName: "Publish artifacts"

      - task: PublishTestResults@2
        inputs:
          searchFolder: "$(Build.SourcesDirectory)/packages/survey-creator-react/test-results"
          testResultsFormat: "JUnit"
          testResultsFiles: "e2e-junit-results.xml"
          mergeTestResults: true
          failTaskOnFailedTests: true
          testRunTitle: "Creator React SCR Legacy Tests"
        condition: succeededOrFailed()
        displayName: "Publish results"

  - job:
    displayName: "SCR Update"
    condition: and(ne(variables['SCR_UPDATE'], ''), ne(variables['System.PullRequest.SourceBranch'], ''))
    steps:
      - template: build.yml
        parameters:
          checkout: ${{ parameters.checkout }}
          libraryCheckout: ${{ parameters.libraryCheckout }}

      - script: npx playwright test --project scr --update-snapshots
        workingDirectory: $(Build.SourcesDirectory)/packages/survey-creator-react
        displayName: "Update SCR"

      - script: | 
          node copy-src-tests.js
          npx playwright test --project scr_legacy --update-snapshots
        workingDirectory: $(Build.SourcesDirectory)/packages/survey-creator-react
        displayName: "Update SCR Legacy"
        condition: eq(variables['System.PullRequest.TargetBranch'], 'V2')

      - powershell: |
          $env:GIT_REDIRECT_STDERR = '2>&1'
          git config --global user.email "surveyjs.org@gmail.com"
          git config --global user.name "surveyjsdeveloper"
          git add $(Build.SourcesDirectory)/screenshotTests
          git add $(Build.SourcesDirectory)/screenshotLegacyTests
          $total = (git diff --cached --name-only | Measure-Object -Line).Lines
          git commit --allow-empty -m "updated $total screenshots" --no-verify
          git fetch origin "$(System.PullRequest.SourceBranch)"
          git rebase --onto "origin/$(System.PullRequest.SourceBranch)" HEAD~1
          git push --no-verify origin "HEAD:$(System.PullRequest.SourceBranch)"
        displayName: "commit updated screenshots"


