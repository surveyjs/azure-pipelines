parameters:
  - name: checkout
    type: string
    default: self

jobs:
  - job:
    displayName: "A11Y & E2E"
    steps:
      - template: build.yml
        parameters:
          checkout: ${{ parameters.checkout }}
          store: true

      - script: npm run build:example:prod
        workingDirectory: $(Build.SourcesDirectory)/packages/survey-vue3-ui
        displayName: "Build Example"

      # the a11y script pins --reporter dot, so junit is appended back here and pointed at
      # its own file to avoid clobbering the e2e results written in the same job
      - script: npm run accessibility-tests:ci -- --reporter dot,junit
        workingDirectory: $(Build.SourcesDirectory)/packages/survey-vue3-ui
        displayName: "Test A11Y"
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: "$(Build.SourcesDirectory)/packages/survey-vue3-ui/test-results/a11y-junit-results.xml"

      - task: PublishBuildArtifacts@1
        displayName: "Publish A11Y artifacts"
        inputs:
          PathtoPublish: "$(Build.SourcesDirectory)/packages/survey-vue3-ui/test-results"
          ArtifactName: "Library_Vue_A11Y"
          publishLocation: "Container"
        condition: always()

      - task: PublishTestResults@2
        displayName: "Publish A11Y results"
        inputs:
          searchFolder: "$(Build.SourcesDirectory)/packages/survey-vue3-ui/test-results"
          testResultsFormat: "JUnit"
          testResultsFiles: "a11y-junit-results.xml"
          mergeTestResults: true
          failTaskOnFailedTests: true
          testRunTitle: "Vue3 A11Y Tests"
        condition: succeededOrFailed()

      - script: npm run e2e:ci
        workingDirectory: $(Build.SourcesDirectory)/packages/survey-vue3-ui
        displayName: "Test E2E"

      - task: PublishBuildArtifacts@1
        displayName: "Publish E2E artifacts"
        inputs:
          PathtoPublish: "$(Build.SourcesDirectory)/packages/survey-vue3-ui/test-results"
          ArtifactName: "Library_Vue_E2E"
          publishLocation: "Container"
        condition: always()

      - task: PublishTestResults@2
        displayName: "Publish E2E results"
        inputs:
          searchFolder: "$(Build.SourcesDirectory)/packages/survey-vue3-ui/test-results"
          testResultsFormat: "JUnit"
          testResultsFiles: "e2e-junit-results.xml"
          mergeTestResults: true
          failTaskOnFailedTests: true
          testRunTitle: "Vue3 E2E Tests"
        condition: succeededOrFailed()

  - job:
    displayName: "SCR"
    steps:
      - template: build.yml
        parameters:
          checkout: ${{ parameters.checkout }}

      - script: npm run build:example:prod
        workingDirectory: $(Build.SourcesDirectory)/packages/survey-vue3-ui
        displayName: "Build Example"

      - script: npm run test
        workingDirectory: $(Build.SourcesDirectory)/packages/survey-vue3-ui
        displayName: "Test Markup"

      - script: npm run scr:ci
        workingDirectory: $(Build.SourcesDirectory)/packages/survey-vue3-ui
        displayName: "Test SCR"

      - task: PublishBuildArtifacts@1
        displayName: "Publish SCR artifacts"
        inputs:
          PathtoPublish: "$(Build.SourcesDirectory)/packages/survey-vue3-ui/test-results"
          ArtifactName: "Library_Vue3_SCR"
          publishLocation: "Container"
        condition: always()

      - task: PublishTestResults@2
        displayName: "Publish SCR results"
        inputs:
          searchFolder: "$(Build.SourcesDirectory)/packages/survey-vue3-ui/test-results"
          testResultsFormat: "JUnit"
          testResultsFiles: "e2e-junit-results.xml"
          mergeTestResults: true
          failTaskOnFailedTests: true
          testRunTitle: "Vue3 SCR Tests"
        condition: succeededOrFailed()
