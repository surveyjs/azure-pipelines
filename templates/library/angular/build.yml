parameters:
  - name: checkout
    type: string
    default: self
  - name: store
    type: boolean
    default: false

steps:
  - checkout: ${{ parameters.checkout }}
    persistCredentials: true
    displayName: "Checkout ${{ parameters.checkout }}"
    timeoutInMinutes: 5
    retryCountOnTaskFailure: 5
    fetchDepth: 1

  # pull/N/merge, not /head: the PR already merged into its base, the same shape of ref Azure
  # checks out for self. The branch tip alone misses commits the base got after the PR forked, so
  # an API that is already on the base branch reads as missing and the build fails. A missing merge
  # ref means the PR conflicts with its base - warn and fall back to the tip rather than fail here.
  - bash: |
      set -euo pipefail
      if git fetch origin "pull/$(PR)/merge"; then
        echo "${{ parameters.checkout }} PR $(PR) merged into its base branch"
      else
        echo "##vso[task.logissue type=warning]pull/$(PR)/merge is unavailable - ${{ parameters.checkout }} PR $(PR) most likely conflicts with its base branch. Falling back to the PR branch tip: this build does not see commits the base branch got after the PR forked."
        git fetch origin "pull/$(PR)/head"
      fi
      git checkout FETCH_HEAD
    workingDirectory: $(Build.SourcesDirectory)
    condition: ne(variables['PR'], '')
    displayName: "Switch to PR $(PR)"

  - template: ../../utils/npm.yml
    parameters:
      directories: 
        - $(Build.SourcesDirectory)
        - $(Build.SourcesDirectory)/packages/survey-core
        - $(Build.SourcesDirectory)/packages/survey-angular-ui
        - $(Build.SourcesDirectory)/packages/survey-angular-ui/example

  - script: npm run build:all
    workingDirectory: $(Build.SourcesDirectory)/packages/survey-core
    displayName: "Build Core"

  - script: npm run build
    workingDirectory: $(Build.SourcesDirectory)/packages/survey-angular-ui
    displayName: "Build"

  - ${{ if eq(parameters.store, true) }}:
    - task: PublishBuildArtifacts@1
      displayName: "Publish build artifacts"
      inputs:
        PathtoPublish: "$(Build.SourcesDirectory)/packages/survey-angular-ui/build"
        ArtifactName: $(ArtifactNameLibraryAngular)
        publishLocation: "Container"
        StoreAsTar: true