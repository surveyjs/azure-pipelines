steps:
  - checkout: self
    persistCredentials: true
    displayName: "Checkout survey-library"
    timeoutInMinutes: 5

  - checkout: SiteData
    persistCredentials: true
    displayName: "Checkout survey-site-data"
    timeoutInMinutes: 5

  - template: ../utils/npm.yml
    parameters:
      directories:
        - $(Build.SourcesDirectory)/survey-library
        - $(Build.SourcesDirectory)/survey-library/packages/survey-core

  # survey-utils comes from a git URL - see the comment in ../utils/npm.yml for why the request
  # needs the extraheader and why ssh is rewritten to https.
  - bash: |
      set -e
      AUTH=""
      if [ -n "${GITHUB_TOKEN:-}" ]; then
        AUTH="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
      fi
      export GIT_CONFIG_COUNT=3
      export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" GIT_CONFIG_VALUE_0="$AUTH"
      export GIT_CONFIG_KEY_1="url.https://github.com/.insteadOf"    GIT_CONFIG_VALUE_1="ssh://git@github.com/"
      export GIT_CONFIG_KEY_2="url.https://github.com/.insteadOf"    GIT_CONFIG_VALUE_2="git@github.com:"
      npm update survey-utils --no-package-lock --no-audit --no-fund
    workingDirectory: $(Build.SourcesDirectory)/survey-library/packages/survey-core
    displayName: "Update survey-utils dependency"
    env:
      GITHUB_TOKEN: $(GITHUB_TOKEN)

  - pwsh: |
      Set-Location $(Build.SourcesDirectory)/survey-library/packages/survey-core
      npm run build:translate

      Set-Location $(Build.SourcesDirectory)/survey-library
      $branch = "$(Build.SourceBranchName)"
      $env:GIT_REDIRECT_STDERR = '2>&1'
      git config user.email "surveyjs.org@gmail.com"
      git config user.name "surveyjsdeveloper"

      git fetch origin $branch
      git checkout -B $branch origin/$branch

      git add packages/survey-core/src/localization
      if (git status --porcelain) {
          echo "There are changes in translations. Committing and pushing to GitHub..."
          git diff --cached --stat
          git commit -m "updated survey-library translation for $branch [azurepipelines skip]"
          git push origin $branch
      }
      else {
          echo "No changes in translations. Skipping commit and push."
      }
    displayName: "l10n for $(Build.SourceBranchName)"
    env:
      TRANSLATION_API_KEY: $(TRANSLATION_API_KEY)

  - script: |
      npm run release -- --skip.tag
      npm run build:all
    workingDirectory: $(Build.SourcesDirectory)/survey-library/packages/survey-core
    displayName: "Build"

  - pwsh: |
      Set-Location $(Build.SourcesDirectory)/surveyjs-site-data
      $branch = "$(siteDataRef)"
      $env:GIT_REDIRECT_STDERR = '2>&1'
      git config user.email "surveyjs.org@gmail.com"
      git config user.name "surveyjsdeveloper"

      git fetch origin $branch
      git checkout -B $branch origin/$branch
      git reset --hard origin/$branch

      Set-Location $(Build.SourcesDirectory)/survey-library/packages/survey-core
      npx survey-utils generate-doc library-site --path $(Build.SourcesDirectory)/survey-library --out $(Build.SourcesDirectory)/surveyjs-site-data

      Set-Location $(Build.SourcesDirectory)/surveyjs-site-data
      git add .
      if (git status --porcelain) {
          echo "There are changes in docs. Committing and pushing to GitHub..."
          git diff --cached --stat
          git commit -m "updated survey-library docs for $branch [azurepipelines skip]"
          git push origin $branch
      }
      else {
          echo "No changes in docs. Skipping commit and push."
      }
    displayName: "Docs for $(Build.SourceBranchName)"
