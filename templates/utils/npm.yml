parameters:
  - name: directories
    type: object

steps:
  # Some package.json files depend on git URLs (survey-utils, eslint-plugin-surveyjs). npm tries
  # https first and, when that fails, silently retries over ssh - where the agent has no key, so
  # the log shows only "Permission denied (publickey)" and hides the real error. The extraheader
  # authenticates the request (anonymous git to github.com gets rate-limited across the agent
  # pool); rewriting ssh to https keeps the real failure visible when it happens. An empty
  # extraheader resets the header list, so a fork PR without the secret still works anonymously.
  - bash: |
      set -e
      export PLAYWRIGHT_SKIP_BROWSER_GC=1

      TOKEN="${GITHUB_TOKEN:-}"
      # a pipeline without the pipeline-secrets group leaves the macro unexpanded
      case "$TOKEN" in '$('*) TOKEN="" ;; esac

      AUTH=""
      if [ -n "$TOKEN" ]; then
        AUTH="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
      fi
      export GIT_CONFIG_COUNT=3
      export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" GIT_CONFIG_VALUE_0="$AUTH"
      export GIT_CONFIG_KEY_1="url.https://github.com/.insteadOf"    GIT_CONFIG_VALUE_1="ssh://git@github.com/"
      export GIT_CONFIG_KEY_2="url.https://github.com/.insteadOf"    GIT_CONFIG_VALUE_2="git@github.com:"

      PUP_CACHE="${PUPPETEER_CACHE_DIR:-$HOME/.cache/puppeteer}"
      if [ -d "$PUP_CACHE" ]; then
        for VER_DIR in "$PUP_CACHE"/*/*/; do
          [ -d "$VER_DIR" ] || continue
          BIN_NAME="$(basename "$(dirname "$VER_DIR")")"
          if [ -z "$(find "$VER_DIR" -type f -name "$BIN_NAME" 2>/dev/null | head -n1)" ]; then
            echo "[puppeteer] removing incomplete browser dir: $VER_DIR"
            rm -rf "$VER_DIR"
          fi
        done
      fi

      CACHE_DIR="/tmp"
      FLAGS="--no-audit --no-fund --no-update-notifier --no-package-lock"
      PIDS=()
      DIRS=()

      for DIR in ${{ join(' ', parameters.directories) }}; do
        (
          PKG_JSON="$DIR/package.json"

          if [ ! -f "$PKG_JSON" ]; then
            echo "[$DIR] package.json not found"
            exit 1
          fi

          PKG_HASH=$(sha256sum "$PKG_JSON" | awk '{print $1}')
          CACHE_FILE="$CACHE_DIR/npm.$PKG_HASH.tar"
          echo "[$DIR] npm install (cache: $CACHE_FILE)"

          if [ -f "$CACHE_FILE" ]; then
            echo "[$DIR] Found cache. Extracting..."
            tar -xf "$CACHE_FILE" -C "$DIR"
          else
            echo "[$DIR] No cache found."
          fi

          cd "$DIR" && npm install $FLAGS

          if [ ! -f "$CACHE_FILE" ]; then
            echo "[$DIR] Creating cache archive..."
            tar -cf "$CACHE_FILE" node_modules
          fi
        ) &
        PIDS+=($!)
        DIRS+=("$DIR")
      done

      FAILED=0
      for i in "${!PIDS[@]}"; do
        if ! wait "${PIDS[$i]}"; then
          echo "FAILED: ${DIRS[$i]}"
          FAILED=1
        fi
      done
      exit $FAILED
    displayName: "npm install"
    env:
      GITHUB_TOKEN: $(GITHUB_TOKEN)
