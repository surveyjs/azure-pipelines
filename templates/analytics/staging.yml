steps:
  - checkout: self
    persistCredentials: true
    displayName: "Checkout survey-analytics"
    timeoutInMinutes: 5

  - checkout: Utils
    displayName: "Checkout survey-utils"
    timeoutInMinutes: 5

  - checkout: SiteData
    persistCredentials: true
    displayName: "Checkout survey-site-data"
    timeoutInMinutes: 5

  - checkout: Service
    persistCredentials: true
    displayName: "Checkout service"
    timeoutInMinutes: 5

  - checkout: Library
    displayName: "Checkout survey-library"
    timeoutInMinutes: 5

  - template: ../utils/npm.yml
    parameters:
      directories:
        - $(Build.SourcesDirectory)/survey-library
        - $(Build.SourcesDirectory)/survey-library/packages/survey-core

  - script: npm run build:all
    workingDirectory: $(Build.SourcesDirectory)/survey-library/packages/survey-core
    displayName: "Build survey-core"

  - script: |
      npm install --legacy-peer-deps
    workingDirectory: $(Build.SourcesDirectory)/survey-analytics
    displayName: "npm install"

  - pwsh: |
      Set-Location $(Build.SourcesDirectory)/survey-utils
      npm install
      npm run build
      node ./dist/translateAnalytics.js

      Set-Location $(Build.SourcesDirectory)/survey-analytics
      $branch = "$(Build.SourceBranchName)"
      $env:GIT_REDIRECT_STDERR = '2>&1'
      git config user.email "surveyjs.org@gmail.com"
      git config user.name "surveyjsdeveloper"

      git fetch origin $branch
      git checkout -B $branch origin/$branch

      git add src/analytics-localization
      if (git status --porcelain) {
          echo "There are changes in translations. Committing and pushing to GitHub..."
          git diff --cached --stat
          git commit -m "updated survey-analytics translation for $branch [azurepipelines skip]"
          git push origin $branch
      }
      else {
          echo "No changes in translations. Skipping commit and push."
      }
    displayName: "l10n for $(Build.SourceBranchName)"
    env:
      TRANSLATION_API_KEY: $(TRANSLATION_API_KEY)

  - script: |
      npm run release -- --skip.tag
      npm run build:all
    workingDirectory: $(Build.SourcesDirectory)/survey-analytics
    displayName: "Build"

  - pwsh: |
      Set-Location $(Build.SourcesDirectory)/survey-analytics
      npm run doc:gen

      Set-Location $(Build.SourcesDirectory)/surveyjs-site-data
      $branch = "$(siteDataRef)"
      $env:GIT_REDIRECT_STDERR = '2>&1'
      git config user.email "surveyjs.org@gmail.com"
      git config user.name "surveyjsdeveloper"

      git fetch origin $branch
      git checkout -B $branch origin/$branch
      git reset --hard origin/$branch

      Copy-Item -Force "$(Build.SourcesDirectory)/survey-analytics/docs/classes.json" "DocsAnalytics/"
      Copy-Item -Force "$(Build.SourcesDirectory)/survey-analytics/docs/pmes.json" "DocsAnalytics/"

      Remove-Item -Recurse -Force "DocsAnalytics/api-reference" -ErrorAction SilentlyContinue
      node $(Build.SourcesDirectory)/survey-utils/dist/cli.js generate-doc analytics --md `
        --path $(Build.SourcesDirectory)/survey-analytics `
        --md-out $(Build.SourcesDirectory)/surveyjs-site-data/DocsAnalytics/api-reference

      git add DocsAnalytics
      if (git status --porcelain) {
          echo "There are changes in docs. Committing and pushing to GitHub..."
          git diff --cached --stat
          git commit -m "updated survey-analytics docs for $branch [azurepipelines skip]"
          git push origin $branch
      }
      else {
          echo "No changes in docs. Skipping commit and push."
      }
    displayName: "Docs for $(Build.SourceBranchName)"

  - pwsh: |
      Set-Location $(Build.SourcesDirectory)/service
      $branch = "$(branch)"
      $env:GIT_REDIRECT_STDERR = '2>&1'
      git config user.email "surveyjs.org@gmail.com"
      git config user.name "surveyjsdeveloper"

      git fetch origin $branch
      git checkout -B $branch origin/$branch
      git reset --hard origin/$branch

      Copy-Item -Force "$(Build.SourcesDirectory)/surveyjs-site-data/DocsAnalytics/classes.json" "surveyjs.io/App_Data/DocsAnalytics/"
      Copy-Item -Force "$(Build.SourcesDirectory)/surveyjs-site-data/DocsAnalytics/pmes.json" "surveyjs.io/App_Data/DocsAnalytics/"
      Copy-Item -Force "$(Build.SourcesDirectory)/surveyjs-site-data/DocsAnalytics/classes.json" "surveyjs.io.web/App_Data/DocsAnalytics/"
      Copy-Item -Force "$(Build.SourcesDirectory)/surveyjs-site-data/DocsAnalytics/pmes.json" "surveyjs.io.web/App_Data/DocsAnalytics/"

      git add surveyjs.io/App_Data/DocsAnalytics/classes.json surveyjs.io/App_Data/DocsAnalytics/pmes.json surveyjs.io.web/App_Data/DocsAnalytics/classes.json surveyjs.io.web/App_Data/DocsAnalytics/pmes.json

      if (git status --porcelain) {
          echo "There are changes in classes.json and pmes.json. Committing and pushing to GitHub..."
          git diff --cached --stat
          git commit -m "updated survey-analytics classes json and pmes jsonfor $branch [azurepipelines skip]"
          git push origin $branch
      }
      else {
          echo "No changes in classes.json and pmes.json. Skipping commit and push."
      }
    displayName: "Docs JSON to service for $(Build.SourceBranchName)"
