# Lint / build / screenshot checks for pull requests in surveyjs/theme-adapter-demos.
# Entry point: azurepipeline.yml in that repository extends this template.

variables:
  - group: pipeline-secrets
  - template: templates/utils/variables.yml

resources:
  repositories:
    - repository: Library
      type: github
      endpoint: github.com_surveyjsdeveloper
      name: surveyjs/survey-library
    - repository: Creator
      type: github
      endpoint: github.com_surveyjsdeveloper
      name: surveyjs/survey-creator

stages:
  # - stage: Lint
  #   displayName: "Lint & Typecheck"
  #   dependsOn: []
  #   jobs:
  #     - job:
  #       steps:
  #         - checkout: self
  #           displayName: "Checkout theme-adapter-demos"
  #           timeoutInMinutes: 5
  #           retryCountOnTaskFailure: 5
  #           fetchDepth: 1

  #         - template: templates/utils/npm.yml
  #           parameters:
  #             directories:
  #               - $(Build.SourcesDirectory)

  #         - script: npm run lint
  #           workingDirectory: $(Build.SourcesDirectory)
  #           displayName: "Lint"

  #         - script: npm run typecheck
  #           workingDirectory: $(Build.SourcesDirectory)
  #           displayName: "Typecheck"

  # Companion PR tags from the PR title: [library: N] [creator: N].
  # See templates/utils/pr_title_parser.yml for the syntax and the GITHUB_TOKEN contract.
  - stage: Options
    dependsOn: []
    jobs:
      - job: PRTitle
        displayName: "PR title"
        condition: eq(variables.isStage, 'False')
        steps:
          - template: templates/utils/pr_title_parser.yml

  - stage: SCR
    displayName: "Screenshot tests"
    dependsOn:
      - Options
    variables:
      # `self` is the demos repo here - its PR is already checked out, nothing to switch.
      PR: ''
      LIBRARY_PR: $[ stageDependencies.Options.PRTitle.outputs['data.LIBRARY'] ]
      CREATOR_PR: $[ stageDependencies.Options.PRTitle.outputs['data.CREATOR'] ]
    jobs:
      - template: templates/theme-adapter-demos/test.yml
        parameters:
          checkout: self
          libraryCheckout: Library
          creatorCheckout: Creator
