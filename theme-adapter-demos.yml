# Lint / build / screenshot checks for pull requests in surveyjs/theme-adapter-demos.
# Entry point: azurepipeline.yml in that repository extends this template.

variables:
  - template: templates/utils/variables.yml

resources:
  repositories:
    - repository: Library
      type: github
      endpoint: github.com_surveyjsdeveloper
      name: surveyjs/survey-library
    - repository: Creator
      type: github
      endpoint: github.com_surveyjsdeveloper
      name: surveyjs/survey-creator

