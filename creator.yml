# Node.js
# Build a general Node.js project with npm.
# Add steps that analyze code, save build artifacts, deploy, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/javascript

variables:
  - group: pipeline-secrets
  - template: templates/utils/variables.yml

resources:
  repositories:
    - repository: Library
      type: github
      endpoint: github.com_surveyjsdeveloper
      name: surveyjs/survey-library
      ref: $(branch)

    - repository: Service
      type: github
      endpoint: github.com_surveyjsdeveloper
      name: surveyjs/service
      ref: $(branch)

    - repository: SiteData
      type: github
      endpoint: github.com_surveyjsdeveloper
      name: surveyjs/surveyjs-site-data
      ref: $(siteDataRef)

    - repository: Utils
      type: github
      endpoint: github.com_surveyjsdeveloper
      name: surveyjs/survey-utils

    # No `ref: $(branch)`: theme-adapter-demos only has `main` — no master/V2/V3
    # counterparts for $(branch) to resolve against.
    - repository: ThemeAdapterDemos
      type: github
      endpoint: github.com_surveyjsdeveloper
      name: surveyjs/theme-adapter-demos

stages:
  - stage: Lint
    dependsOn: []
    jobs:
      - job:
        steps:
          - checkout: self
            timeoutInMinutes: 5
            retryCountOnTaskFailure: 5
            fetchDepth: 1
          
          - template: templates/utils/npm.yml
            parameters:
              directories:
                - $(Build.SourcesDirectory)

          # npm resolves eslint-plugin-surveyjs from a git URL. It tries https first and, when
          # that fails, silently retries over ssh - where the agent has no key, so the log shows
          # only "Permission denied (publickey)" and hides the real error. The extraheader
          # authenticates the request (anonymous git to github.com gets rate-limited across the
          # agent pool); rewriting ssh to https keeps the real failure visible when it happens.
          # An empty extraheader resets the header list, so a fork PR without the secret still
          # works anonymously.
          - bash: |
              set -e
              AUTH=""
              if [ -n "${GITHUB_TOKEN:-}" ]; then
                AUTH="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
              fi
              export GIT_CONFIG_COUNT=3
              export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" GIT_CONFIG_VALUE_0="$AUTH"
              export GIT_CONFIG_KEY_1="url.https://github.com/.insteadOf"    GIT_CONFIG_VALUE_1="ssh://git@github.com/"
              export GIT_CONFIG_KEY_2="url.https://github.com/.insteadOf"    GIT_CONFIG_VALUE_2="git@github.com:"
              npm update eslint-plugin-surveyjs --no-package-lock --no-audit --no-fund
            workingDirectory: $(Build.SourcesDirectory)
            displayName: "Update eslint-plugin-surveyjs dependency"
            env:
              GITHUB_TOKEN: $(GITHUB_TOKEN)

          - script: npm run lint
            workingDirectory: $(Build.SourcesDirectory)

  - stage: Options
    dependsOn: []
    jobs:
      - job: PRTitle
        displayName: "Parse PR title"
        condition: eq(variables.isStage, 'False')
        steps:
          - template: templates/utils/pr_title_parser.yml
      - job: Commit
        displayName: "Commit message"
        condition: eq(variables.isStage, 'False')
        steps:
          - template: templates/utils/commit_message_parser.yml

  ###########
  # CREATOR #
  ###########
  - stage: CreatorCore
    displayName: "Creator Core"
    dependsOn:
      - Options
    variables:
      LIBRARY_PR: $[ stageDependencies.Options.PRTitle.outputs['data.LIBRARY'] ]
    condition: eq(dependencies.Options.outputs['Commit.data.SCR_UPDATE'], '')
    jobs:
      - job:
        displayName: "Build"
        steps:
          - template: templates/creator/core/build.yml
            parameters:
              store: true
      - template: templates/creator/core/test.yml

  - stage: CreatorReactBuild
    displayName: "Creator React"
    dependsOn:
      - Options
    variables:
      SCR_UPDATE: $[ stageDependencies.Options.Commit.outputs['data.SCR_UPDATE'] ]
      LIBRARY_PR: $[ stageDependencies.Options.PRTitle.outputs['data.LIBRARY'] ]
    jobs:
      - job:
        displayName: "Build"
        condition: eq(variables['SCR_UPDATE'], '')
        steps:
          - template: templates/creator/react/build.yml
            parameters:
              store: true
      - template: templates/creator/react/test.yml

  - stage: CreatorAngularBuild
    displayName: "Creator Angular"
    dependsOn:
      - Options
    variables:
      LIBRARY_PR: $[ stageDependencies.Options.PRTitle.outputs['data.LIBRARY'] ]
    condition: eq(dependencies.Options.outputs['Commit.data.SCR_UPDATE'], '')
    jobs:
      - job:
        displayName: "Build"
        steps:
          - template: templates/creator/angular/build.yml
            parameters:
              store: true
      - template: templates/creator/angular/test.yml

  - stage: CreatorVueBuild
    displayName: "Creator Vue"
    dependsOn:
      - Options
    variables:
      LIBRARY_PR: $[ stageDependencies.Options.PRTitle.outputs['data.LIBRARY'] ]
    condition: eq(dependencies.Options.outputs['Commit.data.SCR_UPDATE'], '')
    jobs:
      - job:
        displayName: "Build"
        steps:
          - template: templates/creator/vue/build.yml
            parameters:
              store: true
      - template: templates/creator/vue/test.yml

  - stage: CreatorJSBuild
    displayName: "Creator JS (Preact ShadowDOM BoxSizing)"
    dependsOn:
      - Options
    variables:
      LIBRARY_PR: $[ stageDependencies.Options.PRTitle.outputs['data.LIBRARY'] ]
    condition: eq(dependencies.Options.outputs['Commit.data.SCR_UPDATE'], '')
    jobs:
      - job:
        displayName: "Build"
        steps:
          - template: templates/creator/js/build.yml
            parameters:
              store: true
      - template: templates/creator/js/test.yml

  - stage: ThemeAdapterDemosTest
    displayName: "Theme Adapter Demos SCR"
    dependsOn:
      - Options
    variables:
      PR: $[ stageDependencies.Options.PRTitle.outputs['data.ADAPTERS'] ]
      LIBRARY_PR: $[ stageDependencies.Options.PRTitle.outputs['data.LIBRARY'] ]
    # PRs into master only: the demos track V3 (survey-* ^3.0.0), and running
    # them on staging builds or on the V2/V3 branches is out of scope.
    condition: >-
      and(
        eq(variables['Build.Reason'], 'PullRequest'),
        in(variables['System.PullRequest.TargetBranch'], 'master', 'refs/heads/master'),
        eq(dependencies.Options.outputs['Commit.data.SCR_UPDATE'], '')
      )
    jobs:
      - template: templates/theme-adapter-demos/test.yml
        parameters:
          checkout: ThemeAdapterDemos
          libraryCheckout: Library
          creatorCheckout: self



  ###############
  # Stage Phase #
  ###############
  - ${{ if eq(variables.isStage, 'True') }}:
    - stage: Staging
      displayName: "Staging"
      dependsOn:
        - CreatorCore
        - CreatorReactBuild
        - CreatorAngularBuild
        - CreatorVueBuild
        - CreatorJSBuild
      jobs:
      - job:
        steps:
          - template: templates/creator/staging.yml