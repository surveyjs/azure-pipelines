# Port of templates/library/vue/test.yml (keep in sync while it lives), with its "A11Y & E2E" job
# split in two: a job runs one suite, so a red job tells which.
name: Library Vue Test

on:
  workflow_call:
    inputs:
      ref:
        description: survey-library ref; empty = the triggering commit
        type: string
        default: ""
      pr:
        description: Companion survey-library PR number, or empty
        type: string
        default: ""

defaults:
  run:
    shell: bash --noprofile --norc {0}

# The JUnit reports keep the failed attempts of flaky tests (<flakyFailure>) - publish-test-results
# hands those tests over to the Fails card of the run (the fails job of library.yml).
env:
  PLAYWRIGHT_JUNIT_INCLUDE_RETRIES: "1"

jobs:
  a11y:
    name: Library · Vue · A11Y
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Build survey-library
        uses: surveyjs/azure-pipelines/.github/actions/build-library@gha-migration
        with:
          ref: ${{ inputs.ref }}
          pr: ${{ inputs.pr }}
          package: survey-vue3-ui
          example: "true"
          browsers: "true"
          token: ${{ secrets.SURVEYJS_BOT_TOKEN }}
      - name: Build Example
        working-directory: packages/survey-vue3-ui
        run: npm run build:example:prod
      # the a11y script pins --reporter dot, so junit is appended back here; a junit reporter
      # given on the command line writes to stdout unless pointed at a file
      - name: Test A11Y
        working-directory: packages/survey-vue3-ui
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: ${{ github.workspace }}/packages/survey-vue3-ui/test-results/a11y-junit-results.xml
        run: npm run accessibility-tests:ci -- --reporter dot,junit
      - name: Publish A11Y results
        if: ${{ !cancelled() }}
        uses: surveyjs/azure-pipelines/.github/actions/publish-test-results@gha-migration
        with:
          path: packages/survey-vue3-ui/test-results
          artifact-name: Library_Vue_A11Y
          junit-file: a11y-junit-results.xml
          title: Library Vue3 A11Y Tests

  e2e:
    name: Library · Vue · E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Build survey-library
        uses: surveyjs/azure-pipelines/.github/actions/build-library@gha-migration
        with:
          ref: ${{ inputs.ref }}
          pr: ${{ inputs.pr }}
          package: survey-vue3-ui
          example: "true"
          browsers: "true"
          token: ${{ secrets.SURVEYJS_BOT_TOKEN }}
      - name: Build Example
        working-directory: packages/survey-vue3-ui
        run: npm run build:example:prod
      - name: Test E2E
        working-directory: packages/survey-vue3-ui
        run: npm run e2e:ci -- --workers=100%
      - name: Publish E2E results
        if: ${{ !cancelled() }}
        uses: surveyjs/azure-pipelines/.github/actions/publish-test-results@gha-migration
        with:
          path: packages/survey-vue3-ui/test-results
          artifact-name: Library_Vue_E2E
          junit-file: e2e-junit-results.xml
          title: Library Vue3 E2E Tests
          html-report: packages/survey-vue3-ui/playwright-report

  scr:
    name: Library · Vue · SCR
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Build survey-library
        uses: surveyjs/azure-pipelines/.github/actions/build-library@gha-migration
        with:
          ref: ${{ inputs.ref }}
          pr: ${{ inputs.pr }}
          package: survey-vue3-ui
          example: "true"
          browsers: "true"
          token: ${{ secrets.SURVEYJS_BOT_TOKEN }}
      - name: Build Example
        working-directory: packages/survey-vue3-ui
        run: npm run build:example:prod
      # the junit reporter feeds the run cards; Vitest resolves a relative outputFile against the
      # config, hence the absolute path
      - name: Test Markup
        working-directory: packages/survey-vue3-ui
        env:
          JUNIT_FILE: ${{ runner.temp }}/junit/markup/junit.xml
        run: npm run test -- --reporter=default --reporter=junit --outputFile.junit="$JUNIT_FILE"
      - name: Publish Markup results
        if: ${{ !cancelled() }}
        uses: surveyjs/azure-pipelines/.github/actions/publish-test-results@gha-migration
        with:
          path: ${{ runner.temp }}/junit/markup
          artifact-name: Library_Vue_Markup
          junit-file: junit.xml
          title: Library Vue3 Markup Tests
      - name: Test SCR
        working-directory: packages/survey-vue3-ui
        run: npm run scr:ci -- --workers=100%
      - name: Publish SCR results
        if: ${{ !cancelled() }}
        uses: surveyjs/azure-pipelines/.github/actions/publish-test-results@gha-migration
        with:
          path: packages/survey-vue3-ui/test-results
          artifact-name: Library_Vue3_SCR
          junit-file: e2e-junit-results.xml
          title: Library Vue3 SCR Tests
          playwright-json: results.json
          html-report: packages/survey-vue3-ui/playwright-report
