# The Afterparty group of the survey-library CI run: everything after the tests. result - the single
# required status check, "Afterparty / result" - runs on every run; Staging and Backport
# (sub-projects B and C) will follow it on pushes, so they run only when everything passed. fails
# and test-results write the two test cards of the run, "Fails" and "Test Results", from the reports
# the test jobs upload (run-report); the test jobs write no job summary of their own.
name: Afterparty

on:
  workflow_call:
    inputs:
      needs:
        description: toJSON(needs) of the calling job - every top-level job of the caller workflow before it
        type: string
        required: true

jobs:
  result:
    name: result
    # Explicit: the caller's always() does not settle how the implicit success() of a job in a called
    # workflow counts the caller's skipped needs - and a skipped required check counts as passed.
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Result
        uses: surveyjs/azure-pipelines/.github/actions/result@gha-migration
        with:
          needs: ${{ inputs.needs }}

  # The failed and flaky tests of the run; no card on a clean run.
  fails:
    name: Fails
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fails card
        uses: surveyjs/azure-pipelines/.github/actions/run-report@gha-migration
        with:
          card: fails

  # Every suite of the run. Last, as it merges the reports into the Test Results artifact and deletes
  # them.
  test-results:
    name: Test Results
    needs: fails
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Test Results card
        uses: surveyjs/azure-pipelines/.github/actions/run-report@gha-migration
        with:
          card: all
