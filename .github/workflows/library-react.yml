# Port of templates/library/react/test.yml (keep in sync while it lives), without its "SCR Update"
# job: that one is the scr-update job of library.yml. Its "A11Y & E2E" job is split in two: a job
# runs one suite, so a red job tells which.
name: Library React Test

on:
  workflow_call:
    inputs:
      ref:
        description: survey-library ref; empty = the triggering commit
        type: string
        default: ""
      pr:
        description: Companion survey-library PR number, or empty
        type: string
        default: ""

defaults:
  run:
    shell: bash --noprofile --norc {0}

# The JUnit reports keep the failed attempts of flaky tests (<flakyFailure>) - publish-test-results
# hands those tests over to the test card of the run (the result job of library.yml).
env:
  PLAYWRIGHT_JUNIT_INCLUDE_RETRIES: "1"

jobs:
  markup:
    name: Library · React · Markup
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Build survey-library
        uses: surveyjs/azure-pipelines/.github/actions/build-library@gha-migration
        with:
          ref: ${{ inputs.ref }}
          pr: ${{ inputs.pr }}
          package: survey-react-ui
          token: ${{ secrets.SURVEYJS_BOT_TOKEN }}
      # the junit reporter feeds the test card; Vitest resolves a relative outputFile against the
      # config, hence the absolute path
      - name: Test Markup
        working-directory: packages/survey-react-ui
        env:
          JUNIT_FILE: ${{ runner.temp }}/junit/markup/junit.xml
        run: npm run test -- --reporter=default --reporter=junit --outputFile.junit="$JUNIT_FILE"
      - name: Publish Markup results
        if: ${{ !cancelled() }}
        uses: surveyjs/azure-pipelines/.github/actions/publish-test-results@gha-migration
        with:
          path: ${{ runner.temp }}/junit/markup
          artifact-name: Library_React_Markup
          junit-file: junit.xml
          title: Library React Markup Tests

  a11y:
    name: Library · React · A11Y
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Build survey-library
        uses: surveyjs/azure-pipelines/.github/actions/build-library@gha-migration
        with:
          ref: ${{ inputs.ref }}
          pr: ${{ inputs.pr }}
          package: survey-react-ui
          browsers: "true"
          token: ${{ secrets.SURVEYJS_BOT_TOKEN }}
      # the a11y script pins --reporter dot, so junit is appended back here; a junit reporter
      # given on the command line writes to stdout unless pointed at a file
      - name: Test A11Y
        working-directory: packages/survey-react-ui
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: ${{ github.workspace }}/packages/survey-react-ui/test-results/a11y-junit-results.xml
        run: npm run accessibility-tests:ci -- --reporter dot,junit
      - name: Publish A11Y results
        if: ${{ !cancelled() }}
        uses: surveyjs/azure-pipelines/.github/actions/publish-test-results@gha-migration
        with:
          path: packages/survey-react-ui/test-results
          artifact-name: Library_React_A11Y
          junit-file: a11y-junit-results.xml
          title: Library React A11Y Tests

  e2e:
    name: Library · React · E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Build survey-library
        uses: surveyjs/azure-pipelines/.github/actions/build-library@gha-migration
        with:
          ref: ${{ inputs.ref }}
          pr: ${{ inputs.pr }}
          package: survey-react-ui
          browsers: "true"
          token: ${{ secrets.SURVEYJS_BOT_TOKEN }}
      - name: Test E2E
        working-directory: packages/survey-react-ui
        run: npm run e2e:ci -- --workers=100%
      - name: Publish E2E results
        if: ${{ !cancelled() }}
        uses: surveyjs/azure-pipelines/.github/actions/publish-test-results@gha-migration
        with:
          path: packages/survey-react-ui/test-results
          artifact-name: Library_React_E2E
          junit-file: e2e-junit-results.xml
          title: Library React E2E Tests
          html-report: packages/survey-react-ui/playwright-report

  scr:
    name: Library · React · SCR Test
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Build survey-library
        uses: surveyjs/azure-pipelines/.github/actions/build-library@gha-migration
        with:
          ref: ${{ inputs.ref }}
          pr: ${{ inputs.pr }}
          package: survey-react-ui
          browsers: "true"
          token: ${{ secrets.SURVEYJS_BOT_TOKEN }}
      - name: Test SCR
        working-directory: packages/survey-react-ui
        run: npm run scr:ci -- --workers=100%
      - name: Publish SCR results
        if: ${{ !cancelled() }}
        uses: surveyjs/azure-pipelines/.github/actions/publish-test-results@gha-migration
        with:
          path: packages/survey-react-ui/test-results
          artifact-name: Library_React_SCR
          junit-file: e2e-junit-results.xml
          title: Library React SCR Tests
          playwright-json: results.json
          html-report: packages/survey-react-ui/playwright-report
