# Port of templates/pdf/test.yml (keep in sync while it lives).
name: PDF Test

on:
  workflow_call:
    inputs:
      pdf-ref:
        description: survey-pdf ref - the branch the library PR targets
        type: string
        default: ""
      pdf-pr:
        description: Companion survey-pdf PR number, or empty
        type: string
        default: ""
      library-ref:
        description: survey-library ref; empty = the triggering commit
        type: string
        default: ""
      library-pr:
        description: Companion survey-library PR number, or empty
        type: string
        default: ""

defaults:
  run:
    shell: bash --noprofile --norc {0}

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Build survey-pdf
        uses: surveyjs/azure-pipelines/.github/actions/build-core-consumer@gha-migration
        with:
          repository: surveyjs/survey-pdf
          name: survey-pdf
          ref: ${{ inputs.pdf-ref }}
          pr: ${{ inputs.pdf-pr }}
          library-ref: ${{ inputs.library-ref }}
          library-pr: ${{ inputs.library-pr }}
          token: ${{ secrets.SURVEYJS_BOT_TOKEN }}
      # The config names no reporters, so Vitest would add its github-actions one, which writes a job
      # summary on every run: explicit reporters drop it. junit feeds the run cards, and
      # publish-test-results annotates the failed tests.
      - name: Test
        env:
          JUNIT_FILE: ${{ runner.temp }}/junit/unit/junit.xml
        run: npm run test -- --reporter=default --reporter=junit --outputFile.junit="$JUNIT_FILE"
      - name: Publish results
        if: ${{ !cancelled() }}
        uses: surveyjs/azure-pipelines/.github/actions/publish-test-results@gha-migration
        with:
          path: ${{ runner.temp }}/junit/unit
          artifact-name: PDF_Test
          junit-file: junit.xml
          title: PDF Tests
