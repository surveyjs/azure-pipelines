# The survey-library CI run. survey-library's .github/workflows/library.yml holds only what GitHub
# reads from the repository itself - triggers, token permissions, concurrency - and calls this
# workflow from its only job, CI, as the Azure pipeline extended library.yml@azurepipelines. A port
# of azure-pipelines' library.yml (keep in sync while it lives). GitHub groups the run's sidebar by
# the top-level jobs of the caller, so the whole run is one group, CI, with the leaf jobs in a flat
# list: every leaf job names its area and framework itself ("Library · React · Markup"). After the
# tests: result - the single required status check, "CI / result" - and the two test cards of the
# run, Fails and Test Results, made from the reports the test jobs upload (run-report); the test
# jobs write no job summary of their own.
name: Library

on: workflow_call

defaults:
  run:
    shell: bash --noprofile --norc {0}

jobs:
  lint:
    name: Lint
    # The marker the l10n, docs and release commits carry - the one the Azure pipeline honours.
    # Not [skip ci]: that would also skip tagged-release.yml on the release tag.
    if: ${{ !contains(github.event.head_commit.message, '[azurepipelines skip]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Install
        uses: surveyjs/azure-pipelines/.github/actions/npm-install@gha-migration
        with:
          directories: .
          cache: survey-library
          # eslint-plugin-surveyjs comes from a git URL (surveyjs/eslint-surveyjs): take its tip
          update: . eslint-plugin-surveyjs
          token: ${{ secrets.SURVEYJS_BOT_TOKEN }}
      - name: Lint
        run: npm run lint

  # The gate of the graph. It runs on every event - outside a PR its outputs are {} and "" - so the
  # jobs after it are skipped only when it failed (a bad tag) or the run carries the marker. A job
  # skipped on a push would skip everything after it, result with Staging and Backport included.
  options:
    name: Options
    if: ${{ !contains(github.event.head_commit.message, '[azurepipelines skip]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      scr_update: ${{ steps.options.outputs.scr_update }}
      pr_tags: ${{ steps.options.outputs.pr_tags }}
    steps:
      - id: options
        uses: surveyjs/azure-pipelines/.github/actions/options@gha-migration

  # Port of the "SCR Update" job of templates/library/react/test.yml (keep in sync while it lives).
  # With [scr_update] in the commit message the test jobs are skipped, and this is the only thing
  # that runs.
  scr-update:
    name: SCR Update
    needs: options
    # Pushes back to the PR branch, so only for a PR from this repository.
    if: (needs.options.outputs.scr_update || '') != '' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Build survey-library
        uses: surveyjs/azure-pipelines/.github/actions/build-library@gha-migration
        with:
          package: survey-react-ui
          browsers: "true"
          token: ${{ secrets.SURVEYJS_BOT_TOKEN }}
      - name: Update SCR
        working-directory: packages/survey-react-ui
        run: npm run scr:update -- --workers=100%
      - name: Commit updated screenshots
        env:
          HEAD_REF: ${{ github.head_ref }}
          TOKEN: ${{ secrets.SURVEYJS_BOT_TOKEN }}
        run: |
          set -euo pipefail
          git config user.email "surveyjs.org@gmail.com"
          git config user.name "surveyjsdeveloper"
          git add screenshots
          TOTAL="$(git diff --cached --name-only | wc -l | tr -d ' ')"
          git commit --allow-empty -m "updated $TOTAL screenshots" --no-verify
          # The PAT goes to git through the environment only - never into .git/config. The push
          # must be the PAT's: a push with the workflow token would not start a new CI run.
          AUTH="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" GIT_CONFIG_VALUE_0="$AUTH"
          git fetch origin "$HEAD_REF"
          git rebase --onto "origin/$HEAD_REF" HEAD~1
          # The new baselines, for review and - in the shadow period - to take them from here.
          mkdir -p "$RUNNER_TEMP/scr-update"
          git diff --name-only --diff-filter=AM HEAD~1 HEAD -- screenshots | while IFS= read -r F; do
            mkdir -p "$RUNNER_TEMP/scr-update/$(dirname "$F")"
            cp "$F" "$RUNNER_TEMP/scr-update/$F"
          done
          # SHADOW-OFF: git push --no-verify origin "HEAD:$HEAD_REF"
      - name: Publish updated screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: Library_SCR_Update
          path: ${{ runner.temp }}/scr-update
          if-no-files-found: ignore
          overwrite: true
          retention-days: 14

  # The Library*Test stages. The names of these calling jobs show in the check names only
  # ("CI / Library React / Library · React · Markup"), never in the sidebar.
  library-core:
    name: Library Core
    needs: options
    if: (needs.options.outputs.scr_update || '') == ''
    uses: surveyjs/azure-pipelines/.github/workflows/library-core.yml@gha-migration
    secrets: inherit

  library-react:
    name: Library React
    needs: options
    if: (needs.options.outputs.scr_update || '') == ''
    uses: surveyjs/azure-pipelines/.github/workflows/library-react.yml@gha-migration
    secrets: inherit

  library-angular:
    name: Library Angular
    needs: options
    if: (needs.options.outputs.scr_update || '') == ''
    uses: surveyjs/azure-pipelines/.github/workflows/library-angular.yml@gha-migration
    secrets: inherit

  library-vue:
    name: Library Vue
    needs: options
    if: (needs.options.outputs.scr_update || '') == ''
    uses: surveyjs/azure-pipelines/.github/workflows/library-vue.yml@gha-migration
    secrets: inherit

  library-js:
    name: Library JS
    needs: options
    if: (needs.options.outputs.scr_update || '') == ''
    uses: surveyjs/azure-pipelines/.github/workflows/library-js.yml@gha-migration
    secrets: inherit

  # The Creator*Test stages: survey-creator of the branch the library PR targets, or its companion
  # PR from the CREATOR tag.
  creator-core:
    name: Creator Core
    needs: options
    if: (needs.options.outputs.scr_update || '') == ''
    uses: surveyjs/azure-pipelines/.github/workflows/creator-core.yml@gha-migration
    with:
      creator-ref: ${{ github.base_ref || github.ref_name }}
      creator-pr: ${{ fromJSON(needs.options.outputs.pr_tags || '{}').CREATOR || '' }}
    secrets: inherit

  creator-react:
    name: Creator React
    needs: options
    if: (needs.options.outputs.scr_update || '') == ''
    uses: surveyjs/azure-pipelines/.github/workflows/creator-react.yml@gha-migration
    with:
      creator-ref: ${{ github.base_ref || github.ref_name }}
      creator-pr: ${{ fromJSON(needs.options.outputs.pr_tags || '{}').CREATOR || '' }}
    secrets: inherit

  creator-angular:
    name: Creator Angular
    needs: options
    if: (needs.options.outputs.scr_update || '') == ''
    uses: surveyjs/azure-pipelines/.github/workflows/creator-angular.yml@gha-migration
    with:
      creator-ref: ${{ github.base_ref || github.ref_name }}
      creator-pr: ${{ fromJSON(needs.options.outputs.pr_tags || '{}').CREATOR || '' }}
    secrets: inherit

  creator-vue:
    name: Creator Vue
    needs: options
    if: (needs.options.outputs.scr_update || '') == ''
    uses: surveyjs/azure-pipelines/.github/workflows/creator-vue.yml@gha-migration
    with:
      creator-ref: ${{ github.base_ref || github.ref_name }}
      creator-pr: ${{ fromJSON(needs.options.outputs.pr_tags || '{}').CREATOR || '' }}
    secrets: inherit

  creator-js:
    name: Creator JS
    needs: options
    if: (needs.options.outputs.scr_update || '') == ''
    uses: surveyjs/azure-pipelines/.github/workflows/creator-js.yml@gha-migration
    with:
      creator-ref: ${{ github.base_ref || github.ref_name }}
      creator-pr: ${{ fromJSON(needs.options.outputs.pr_tags || '{}').CREATOR || '' }}
    secrets: inherit

  analytics:
    name: Analytics
    needs: options
    if: (needs.options.outputs.scr_update || '') == ''
    uses: surveyjs/azure-pipelines/.github/workflows/analytics-test.yml@gha-migration
    with:
      analytics-ref: ${{ github.base_ref || github.ref_name }}
      analytics-pr: ${{ fromJSON(needs.options.outputs.pr_tags || '{}').ANALYTICS || '' }}
    secrets: inherit

  pdf:
    name: PDF
    needs: options
    if: (needs.options.outputs.scr_update || '') == ''
    uses: surveyjs/azure-pipelines/.github/workflows/pdf-test.yml@gha-migration
    with:
      pdf-ref: ${{ github.base_ref || github.ref_name }}
      pdf-pr: ${{ fromJSON(needs.options.outputs.pr_tags || '{}').PDF || '' }}
    secrets: inherit

  theme-adapter-demos:
    name: Theme Adapter Demos
    needs: options
    if: (needs.options.outputs.scr_update || '') == '' && github.event_name == 'pull_request' && github.base_ref == 'master'
    uses: surveyjs/azure-pipelines/.github/workflows/theme-adapter-demos-test.yml@gha-migration
    with:
      demos-pr: ${{ fromJSON(needs.options.outputs.pr_tags || '{}').ADAPTERS || '' }}
      creator-ref: ${{ github.base_ref || github.ref_name }}
      creator-pr: ${{ fromJSON(needs.options.outputs.pr_tags || '{}').CREATOR || '' }}
    secrets: inherit

  # The single required status check, "CI / result": it needs every job above. always(): result
  # reports on every run, a failed or cancelled one included - a skipped required check counts as
  # passed. Staging and Backport (sub-projects B and C) will follow it on pushes, so they run only
  # when everything passed.
  result:
    name: result
    needs:
      - lint
      - options
      - scr-update
      - library-core
      - library-react
      - library-angular
      - library-vue
      - library-js
      - creator-core
      - creator-react
      - creator-angular
      - creator-vue
      - creator-js
      - analytics
      - pdf
      - theme-adapter-demos
    if: ${{ always() && !contains(github.event.head_commit.message, '[azurepipelines skip]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Result
        uses: surveyjs/azure-pipelines/.github/actions/result@gha-migration
        with:
          needs: ${{ toJSON(needs) }}

  # The failed and flaky tests of the run; no card on a clean run. It needs the jobs result needs:
  # the cards are made from the reports the test jobs upload.
  fails:
    name: Fails
    needs:
      - lint
      - options
      - scr-update
      - library-core
      - library-react
      - library-angular
      - library-vue
      - library-js
      - creator-core
      - creator-react
      - creator-angular
      - creator-vue
      - creator-js
      - analytics
      - pdf
      - theme-adapter-demos
    if: ${{ !cancelled() && !contains(github.event.head_commit.message, '[azurepipelines skip]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fails card
        uses: surveyjs/azure-pipelines/.github/actions/run-report@gha-migration
        with:
          card: fails

  # Every suite of the run. Last, as it merges the reports into the Test Results artifact and deletes
  # them.
  test-results:
    name: Test Results
    needs: fails
    if: ${{ !cancelled() && !contains(github.event.head_commit.message, '[azurepipelines skip]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Test Results card
        uses: surveyjs/azure-pipelines/.github/actions/run-report@gha-migration
        with:
          card: all
