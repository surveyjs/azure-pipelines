# Port of templates/library/js/test.yml (keep in sync while it lives), with its "A11Y & E2E" job
# split in two: a job publishes one report, so the summary of a failed job is about one suite.
name: Library JS (Preact ShadowDOM BoxSizing) Test

on:
  workflow_call:
    inputs:
      ref:
        description: survey-library ref; empty = the triggering commit
        type: string
        default: ""
      pr:
        description: Companion survey-library PR number, or empty
        type: string
        default: ""

defaults:
  run:
    shell: bash --noprofile --norc {0}

# The JUnit reports keep the failed attempts of flaky tests (<flakyFailure>) - publish-test-results
# lists those tests in the summary of a failed job.
env:
  PLAYWRIGHT_JUNIT_INCLUDE_RETRIES: "1"

jobs:
  a11y:
    name: JS · A11Y
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Build survey-library
        uses: surveyjs/azure-pipelines/.github/actions/build-library@gha-migration
        with:
          ref: ${{ inputs.ref }}
          pr: ${{ inputs.pr }}
          package: survey-js-ui
          browsers: "true"
          token: ${{ secrets.SURVEYJS_BOT_TOKEN }}
      # the a11y script pins --reporter dot, so junit is appended back here; a junit reporter
      # given on the command line writes to stdout unless pointed at a file
      - name: Test A11Y
        working-directory: packages/survey-js-ui
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: ${{ github.workspace }}/packages/survey-js-ui/test-results/a11y-junit-results.xml
        run: npm run accessibility-tests:ci -- --reporter dot,junit
      - name: Publish A11Y results
        if: ${{ !cancelled() }}
        uses: surveyjs/azure-pipelines/.github/actions/publish-test-results@gha-migration
        with:
          path: packages/survey-js-ui/test-results
          artifact-name: Library_Preact_A11Y
          junit-file: a11y-junit-results.xml
          title: Preact A11Y Tests

  e2e:
    name: JS · E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Build survey-library
        uses: surveyjs/azure-pipelines/.github/actions/build-library@gha-migration
        with:
          ref: ${{ inputs.ref }}
          pr: ${{ inputs.pr }}
          package: survey-js-ui
          browsers: "true"
          token: ${{ secrets.SURVEYJS_BOT_TOKEN }}
      - name: Test E2E
        working-directory: packages/survey-js-ui
        run: npm run e2e:ci -- --workers=100%
      - name: Publish E2E results
        if: ${{ !cancelled() }}
        uses: surveyjs/azure-pipelines/.github/actions/publish-test-results@gha-migration
        with:
          path: packages/survey-js-ui/test-results
          artifact-name: Library_Preact_E2E
          junit-file: e2e-junit-results.xml
          title: Preact E2E Tests
          html-report: packages/survey-js-ui/playwright-report

  scr:
    name: JS · SCR
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Build survey-library
        uses: surveyjs/azure-pipelines/.github/actions/build-library@gha-migration
        with:
          ref: ${{ inputs.ref }}
          pr: ${{ inputs.pr }}
          package: survey-js-ui
          browsers: "true"
          token: ${{ secrets.SURVEYJS_BOT_TOKEN }}
      - name: Test SCR
        working-directory: packages/survey-js-ui
        run: npm run scr:ci -- --workers=100%
      - name: Publish SCR results
        if: ${{ !cancelled() }}
        uses: surveyjs/azure-pipelines/.github/actions/publish-test-results@gha-migration
        with:
          path: packages/survey-js-ui/test-results
          artifact-name: Library_Preact_SCR
          junit-file: e2e-junit-results.xml
          title: Preact SCR Tests
          playwright-json: results.json
          html-report: packages/survey-js-ui/playwright-report
