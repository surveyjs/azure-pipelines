# Port of templates/creator/core/test.yml (keep in sync while it lives). Unlike Azure, the unit
# tests run in two Vitest shards - one job per shard, PostCSS in the first - and without the
# Presets step: `npm run test` (vitest run) already runs the presets project.
name: Creator Core Test

on:
  workflow_call:
    inputs:
      creator-ref:
        description: survey-creator ref - the branch the library PR targets
        type: string
        default: ""
      creator-pr:
        description: Companion survey-creator PR number, or empty
        type: string
        default: ""
      library-ref:
        description: survey-library ref; empty = the triggering commit
        type: string
        default: ""
      library-pr:
        description: Companion survey-library PR number, or empty
        type: string
        default: ""

defaults:
  run:
    shell: bash --noprofile --norc {0}

jobs:
  unit:
    name: "Creator · Core · Unit (${{ matrix.shard }}/2)"
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Build survey-creator
        uses: surveyjs/azure-pipelines/.github/actions/build-creator@gha-migration
        with:
          creator-ref: ${{ inputs.creator-ref }}
          creator-pr: ${{ inputs.creator-pr }}
          library-ref: ${{ inputs.library-ref }}
          library-pr: ${{ inputs.library-pr }}
          token: ${{ secrets.SURVEYJS_BOT_TOKEN }}
      # the config writes JUnit already, into the package; the test card takes it from runner.temp
      - name: Unit
        working-directory: packages/survey-creator-core
        env:
          JUNIT_FILE: ${{ runner.temp }}/junit/unit/junit.xml
        run: npm run test -- --shard=${{ matrix.shard }}/2 --outputFile.junit="$JUNIT_FILE"
      - name: Publish Unit results
        if: ${{ !cancelled() }}
        uses: surveyjs/azure-pipelines/.github/actions/publish-test-results@gha-migration
        with:
          path: ${{ runner.temp }}/junit/unit
          artifact-name: Creator_Core_Unit_${{ matrix.shard }}
          junit-file: junit.xml
          title: Creator Core Unit Tests (${{ matrix.shard }}/2)
      - name: PostCSS
        if: matrix.shard == 1
        working-directory: packages/survey-creator-core
        run: npm run test:postcss
