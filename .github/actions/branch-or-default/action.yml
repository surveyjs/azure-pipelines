name: Branch or the default branch
description: >
  The ref to check a companion repository out at: `ref` when the repository has that branch or tag,
  empty (= its default branch, with a notice) when it does not. A survey-library PR into a branch
  the companion repositories lack (a stacked PR, a test branch) then builds them from their
  default branch instead of failing every downstream job at the checkout.
inputs:
  repository:
    description: Repository (owner/name)
    required: true
  ref:
    description: Branch or tag, or empty
    default: ""
  name:
    description: Repository name for the log
    required: true
  token:
    description: PAT for the lookup; empty looks up anonymously
    default: ""
outputs:
  ref:
    description: The ref to check out; empty = the default branch
    value: ${{ steps.resolve.outputs.ref }}
runs:
  using: composite
  steps:
    - name: Resolve the ${{ inputs.name }} ref
      id: resolve
      shell: bash --noprofile --norc {0}
      env:
        REPO_URL: https://github.com/${{ inputs.repository }}.git
        REF: ${{ inputs.ref }}
        REPO_NAME: ${{ inputs.name }}
        GIT_TOKEN: ${{ inputs.token }}
      run: bash "$GITHUB_ACTION_PATH/resolve.sh"
