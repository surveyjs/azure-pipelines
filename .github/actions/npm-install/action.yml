name: npm install
description: >
  Port of templates/utils/npm.yml (keep in sync while it lives): sets Node up and runs
  `npm install` in every listed directory in parallel, then the optional `npm update`s. With
  `cache`, restores ~/.npm from the family's cache first; with `cache-save` as well, saves it
  afterwards (the cache-warm jobs). Azure cached node_modules tarballs in /tmp of its agents
  instead.
inputs:
  directories:
    description: Directories to install, one per line, relative to the workspace
    required: true
  update:
    description: Optional "<directory> <package>" lines to `npm update` after the installs
    default: ""
  token:
    description: PAT for the git dependencies; empty installs anonymously
    default: ""
  browsers:
    description: "'true' - also install the system libraries of Playwright's Chromium"
    default: "false"
  cache:
    description: Cache family (survey-library, survey-creator, ...); empty = no ~/.npm cache
    default: ""
  cache-save:
    description: "'true' - save ~/.npm under this install's key (cache-warm jobs only); see cache-key.sh"
    default: "false"
  node-version:
    # 24, not 22: the creator and analytics packages depend on survey-library through file: paths
    # (../../../survey-library/packages/survey-core/build) that do not exist yet at install time.
    # npm 11 (Node 24) links them anyway and the build copy replaces the link; npm 10 (Node 22)
    # crashes with "Cannot read properties of null (reading 'edgesOut')".
    description: Node.js version (npm 11 is required - see the comment above)
    default: "24"
runs:
  using: composite
  steps:
    - name: Set up Node.js ${{ inputs.node-version }}
      uses: actions/setup-node@v5
      with:
        node-version: ${{ inputs.node-version }}
        package-manager-cache: false
    # actions/cache/restore and /save rather than actions/cache: the runner does not run the post
    # steps of an action nested in a composite action, so actions/cache would never save.
    - name: Compute the npm cache key
      id: cache-key
      if: inputs.cache != ''
      shell: bash --noprofile --norc {0}
      env:
        NPM_DIRS: ${{ inputs.directories }}
        CACHE_FAMILY: ${{ inputs.cache }}
        CACHE_SAVE: ${{ inputs.cache-save }}
      run: bash "$GITHUB_ACTION_PATH/cache-key.sh"
    - name: Restore the npm cache
      id: cache-restore
      if: inputs.cache != ''
      uses: actions/cache/restore@v4
      with:
        path: ~/.npm/_cacache
        key: ${{ steps.cache-key.outputs.key }}
        restore-keys: ${{ steps.cache-key.outputs.restore-keys }}
    - name: npm install
      shell: bash --noprofile --norc {0}
      env:
        NPM_DIRS: ${{ inputs.directories }}
        NPM_UPDATE: ${{ inputs.update }}
        GITHUB_TOKEN: ${{ inputs.token }}
      run: bash "$GITHUB_ACTION_PATH/install.sh"
    - name: Save the npm cache
      if: inputs.cache != '' && inputs.cache-save == 'true' && steps.cache-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ~/.npm/_cacache
        key: ${{ steps.cache-key.outputs.key }}
    - name: Install the Chromium system libraries
      if: inputs.browsers == 'true'
      shell: bash --noprofile --norc {0}
      env:
        NPM_DIRS: ${{ inputs.directories }}
      run: bash "$GITHUB_ACTION_PATH/browser-deps.sh"
