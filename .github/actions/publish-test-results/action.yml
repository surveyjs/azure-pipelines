name: Publish test results
description: >
  Port of the PublishBuildArtifacts(test-results) + PublishTestResults@2 pair of the Azure test
  templates. Reports the failed tests of the JUnit file as annotations (annotate_only: no checks
  permission, so it works on fork PRs too) and uploads the report as JUnit_<artifact-name>, with the
  title, the job status and the link to the screenshot diff page, for the two cards of the run that
  Afterparty makes (run-report): Fails and Test Results. Unlike Azure, a job writes no job summary
  of its own, and the results directory goes up as an artifact only when the job has failed.
  Playwright writes the failed attempts of a flaky test to the JUnit report (<flakyFailure> /
  <flakyError>) only with PLAYWRIGHT_JUNIT_INCLUDE_RETRIES=1, which the test workflows set; without
  it a flaky test looks passed. Call it with an `if` that keeps it running after a failed test step
  unless the run was cancelled - Azure ran these with always() / succeededOrFailed(). With
  playwright-json it also publishes the screenshot diff page - one HTML file with the expected /
  actual / diff images of every mismatch, flaky ones included, opened right in the browser (a
  non-zipped artifact: signed-in users with access to the repository, 14 days), linked from the
  Fails card. With html-report a failed job also uploads the Playwright HTML report as
  <artifact-name>_Report, for `npx playwright show-report`.
inputs:
  path:
    description: Directory to upload - relative to the workspace, or absolute
    required: true
  artifact-name:
    description: Artifact name - the Azure ArtifactName
    required: true
  junit-file:
    description: >
      JUnit file name inside `path`, or a glob for several (a test script of a few runs writes a
      file each); empty uploads without a report
    default: ""
  title:
    description: Report title - the Azure testRunTitle
    default: "Tests"
  playwright-json:
    description: Playwright JSON report file name inside `path`; empty - no screenshot diff page
    default: ""
  html-report:
    description: Playwright HTML report directory, relative to the workspace; empty - not uploaded
    default: ""
runs:
  using: composite
  steps:
    # always(): the caller's `if` already decided that the action runs; every step runs then, after
    # a failed test step too. No ${{ }} in the description above - the runner evaluates it there as well.
    # The uploads check job.status, not failure(): inside a composite action failure() sees only the
    # action's own steps, never the failed test step before it.
    - name: Upload test results
      if: always() && job.status == 'failure'
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.path }}
        if-no-files-found: ignore
        overwrite: true
        retention-days: 14
    - name: Upload the Playwright HTML report
      if: always() && job.status == 'failure' && inputs.html-report != ''
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-name }}_Report
        path: ${{ inputs.html-report }}
        # theme-adapter-demos writes its report to the hidden screenshot-tests/.report
        include-hidden-files: true
        if-no-files-found: ignore
        overwrite: true
        retention-days: 14
    - name: Build the screenshot diff page
      if: always() && inputs.playwright-json != ''
      id: diff-page
      shell: bash --noprofile --norc {0}
      env:
        RESULTS_JSON: ${{ inputs.path }}/${{ inputs.playwright-json }}
        OUT_FILE: ${{ runner.temp }}/scr-diff/${{ inputs.artifact-name }}-diff.html
        TITLE: ${{ inputs.title }}
      run: bash "$GITHUB_ACTION_PATH/scr-diff.sh"
    # archive: false - a single file, served as it is, so the browser opens it. The artifact is named
    # after the file; `name` repeats the file name because overwrite looks the old artifact up by
    # `name` (actions/upload-artifact#769) - without it a re-run fails with 409.
    - name: Upload the screenshot diff page
      if: always() && steps.diff-page.outputs.count != '' && steps.diff-page.outputs.count != '0'
      id: diff-upload
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-name }}-diff.html
        path: ${{ runner.temp }}/scr-diff/${{ inputs.artifact-name }}-diff.html
        archive: false
        overwrite: true
        retention-days: 14
    # The run cards of Afterparty (run-report) are made from these: every job, a green one too,
    # uploads its report with a meta.json - the title, the job status, the diff page. One folder
    # inside the artifact, named after it, keeps a download the same however many are fetched.
    - name: Stage the report for the run cards
      if: always() && inputs.junit-file != ''
      shell: bash --noprofile --norc {0}
      env:
        DIR: ${{ runner.temp }}/run-report/${{ inputs.artifact-name }}/${{ inputs.artifact-name }}
        NAME: ${{ inputs.artifact-name }}
        TITLE: ${{ inputs.title }}
        STATUS: ${{ job.status }}
        JUNIT_FILE: ${{ inputs.path }}/${{ inputs.junit-file }}
        DIFF_URL: ${{ steps.diff-upload.outputs.artifact-url }}
        DIFF_FAILED: ${{ steps.diff-page.outputs.failed }}
        DIFF_FLAKY: ${{ steps.diff-page.outputs.flaky }}
      run: bash "$GITHUB_ACTION_PATH/stage-report.sh"
    # A day is enough: the all card merges these into Test Results and deletes them.
    - name: Upload the report for the run cards
      if: always() && inputs.junit-file != ''
      uses: actions/upload-artifact@v7
      with:
        name: JUnit_${{ inputs.artifact-name }}
        path: ${{ runner.temp }}/run-report/${{ inputs.artifact-name }}
        if-no-files-found: ignore
        overwrite: true
        retention-days: 1
    # Annotations only - the cards of the run are in Afterparty.
    - name: Report the JUnit results
      if: always() && inputs.junit-file != ''
      uses: mikepenz/action-junit-report@v6
      with:
        report_paths: ${{ inputs.path }}/${{ inputs.junit-file }}
        check_name: ${{ inputs.title }}
        annotate_only: true
        job_summary: false
        include_passed: false
        require_tests: false
        fail_on_failure: true
