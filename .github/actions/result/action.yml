name: Library CI result
description: >
  The single required status check of the survey-library CI ("CI / result"): fails when a
  job of library.yml failed or was cancelled. A job skipped by its own condition
  (scr_update, Theme Adapter Demos outside a PR to master) is fine.
inputs:
  needs:
    description: toJSON(needs) of the calling job
    required: true
runs:
  using: composite
  steps:
    - name: Check the needed jobs
      shell: bash --noprofile --norc {0}
      env:
        # Through the environment, never interpolated: the needs outputs carry PR-title text.
        NEEDS: ${{ inputs.needs }}
      run: bash "$GITHUB_ACTION_PATH/check.sh"
